
appConfig:
  theme: dark
  layout: auto
  iconSize: medium
  language: id

pageInfo:
  title: Portal IT PMA
  description: Dashboard Internal IT

sections:
  - name: Aplikasi Utama
    items:
      - title: GLPI
        icon: fas fa-ticket-alt
        url: http://192.168.220.133/glpi
      - title: ERPNext
        icon: fas fa-cogs
        url: http://192.168.220.133/erpnext
      - title: n8n
        icon: fas fa-project-diagram
        url: http://192.168.220.133/n8n
      - title: Rocket.Chat
        icon: fas fa-comments
        url: http://192.168.220.133/chat

  - name: Widgets
    displayData:
      sortBy: default
      rows: 1
      cols: 1
      collapsed: false
      hideForGuests: false
    widgets:
      - type: clock
        options:
          timeZone: Asia/Jakarta
          format: id-ID
          hideDate: false

      - type: joke
        options:
          language: en
          category: programming

      - type: public-holidays
        options:
          country: ID
          holidayType: all
          monthsToShow: 5

      - type: public-ip
        options:
          provider: ipapi.co

      - type: github-profile-stats
        options:
          username: dr460nf1r3
          hideLanguagesCard: true

      # Widget Cuaca
      - type: weather
        options:
          apiKey: 18b1a41318bbe89939c3be6ea7f1c207
          location: Jakarta,ID
          units: metric
          showForecast: true

      # Widget Network Speed
      - type: network-speed
        options:
          refreshInterval: 60
          showGraph: true

      # Widget Berita Terkini
      - type: news
        options:
          source: indonesia
          category: general
          maxArticles: 5
